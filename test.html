<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated YouTube Modal - Production Ready</title>
    <!-- Set a clean fallback referrer standard for cross-origin compliance -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #121214;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Styled Trigger Button */
        .open-btn {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }
        .open-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4);
        }
        /* Style when the button is waiting for YouTube API to load */
        .open-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #444;
            box-shadow: none;
        }

        /* Backdrop Blur Container */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        /* Modal Box Animation Setup */
        .modal-content {
            background: #1e1e24;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            transform: scale(0.85) translateY(40px);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Aspect Ratio Box for 16:9 Video */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
            background: #000; /* Prevent white flash before player loads */
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Modern Close Button */
        .close-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 36px;
            height: 36px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background 0.2s, transform 0.2s;
            z-index: 1010;
        }
        .close-btn:hover {
            background: #e0004c;
            transform: scale(1.1);
        }

        /* Active Transition States */
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Trigger Button (Disabled until YouTube API tells us it's completely ready) -->
    <button class="open-btn" id="openModalBtn" disabled>Loading Player...</button>

    <!-- Modal Backdrop -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <!-- Close Button -->
            <button class="close-btn" id="closeModalBtn" aria-label="Close modal">&times;</button>
            
            <!-- Video Wrapper Target Element -->
            <div class="video-container">
                <div id="player"></div>
            </div>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR ACTUAL YOUTUBE VIDEO ID
        const videoId = 'dQw4w9WgXcQ'; 

        let player;
        let isPlayerReady = false;
        const modalOverlay = document.getElementById('modalOverlay');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // 1. Asynchronously load the official IFrame API
        const tag = document.createElement('script');
        tag.src = "https://youtube.com";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // 2. Global API callback initializer function
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 0, // Controlled strictly via button logic later
                    'playsinline': 1,
                    'rel': 0,
                    'enablejsapi': 1, // Crucial parameter to allow API commands across live domains
                    'origin': window.location.origin || '*' // Adapts seamlessly to file:// or absolute HTTPS domains
                },
                events: {
                    'onReady': onPlayerReady // Fires only when the layout element completely mounts
                }
            });
        }

        // 3. Callback tracking state validation completion
        function onPlayerReady(event) {
            isPlayerReady = true;
            openModalBtn.disabled = false; // Activation button lights up safely
            openModalBtn.innerText = "Watch Video";
        }

        // 4. Modal Activation Trigger 
        openModalBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
            // Check state verification explicitly before tracking commands
            if (isPlayerReady && player && typeof player.playVideo === 'function') {
                // Short timeout gives CSS transitions 50ms to finish painting layout elements
                setTimeout(() => {
                    player.playVideo();
                }, 50);
            }
        });

        // 5. Deactivation Controller (Stops Data Buffering)
        function closeModal() {
            modalOverlay.classList.remove('active');
            if (isPlayerReady && player && typeof player.stopVideo === 'function') {
                player.stopVideo(); // Terminating execution drops local active connection threads
            }
        }

        closeModalBtn.addEventListener('click', closeModal);

        // Backdrop Dismissal Target
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });
    </script>
</body>
</html>
