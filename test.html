<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated YouTube Modal - Bulletproof Fix</title>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #121214;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Styled Trigger Button */
        .open-btn {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }
        .open-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4);
        }
        .open-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #444;
            box-shadow: none;
        }

        /* Backdrop Blur Container */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        /* Modal Box Animation Setup */
        .modal-content {
            background: #1e1e24;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            transform: scale(0.85) translateY(40px);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Aspect Ratio Box for 16:9 Video */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            height: 0;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
            background: #000; 
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Modern Close Button */
        .close-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 36px;
            height: 36px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background 0.2s, transform 0.2s;
            z-index: 1010;
        }
        .close-btn:hover {
            background: #e0004c;
            transform: scale(1.1);
        }

        /* Active Transition States */
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }
    </style>
</head>
<body>

    <button class="open-btn" id="openModalBtn" disabled>Loading Player...</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closeModalBtn" aria-label="Close modal">&times;</button>
            <div class="video-container">
                <div id="player"></div>
            </div>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR ACTUAL YOUTUBE VIDEO ID
        const videoId = 'BzNGvUkCHRc'; 

        let player;
        let isPlayerReady = false;
        const modalOverlay = document.getElementById('modalOverlay');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // 1. Instantly append the API Script Tag
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // 2. Continuous Verification Loop using an Interval Fallback
        // This acts as a net to catch the initialization even if the global callback finishes early.
        const checkYoutubeAPI = setInterval(() => {
            if (typeof YT !== 'undefined' && YT.loaded && typeof YT.ready === 'function') {
                clearInterval(checkYoutubeAPI); // Clear the interval instantly
                
                // Use the internal engine loader wrapper to safe-mount the configuration
                YT.ready(initializePlayer);
            }
        }, 50);

        // 3. Fallback handle matching traditional behaviors 
        window.onYouTubeIframeAPIReady = function() {
            if (!player) {
                initializePlayer();
            }
        };

        // 4. Primary Modular Initialization Command
        function initializePlayer() {
            if (player) return; // Prevent double creation artifacts

            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 0,
                    'playsinline': 1,
                    'rel': 0,
                    'enablejsapi': 1,
                    'origin': window.location.origin || '*'
                },
                events: {
                    'onReady': (event) => {
                        isPlayerReady = true;
                        openModalBtn.disabled = false; 
                        openModalBtn.innerText = "Watch Video";
                    }
                }
            });
        }

        // 5. Open Modal Trigger Logic
        openModalBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
            if (isPlayerReady && player && typeof player.playVideo === 'function') {
                setTimeout(() => {
                    player.playVideo();
                }, 50);
            }
        });

        // 6. Close Modal Controller 
        function closeModal() {
            modalOverlay.classList.remove('active');
            if (isPlayerReady && player && typeof player.stopVideo === 'function') {
                player.stopVideo(); 
            }
        }

        closeModalBtn.addEventListener('click', closeModal);

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });
    </script>
</body>
</html>
