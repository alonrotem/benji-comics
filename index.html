<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booklet Collection Library</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #eae6df; /* Matches your booklet's warm linen backdrop */
            font-family: system-ui, -apple-system, sans-serif;
            color: #4a443c;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centers the whole library vertically if it fits the screen */
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            max-width: 600px;
        }

        header h1 {
            font-family: 'Georgia', serif;
            font-size: 2.5rem;
            color: #2c251e;
            margin-bottom: 12px;
            font-weight: normal;
            letter-spacing: 0.5px;
        }

        header p {
            color: #7a7164;
            font-size: 1rem;
            line-height: 1.5;
        }

        /* Centered Library Container */
        .library-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; /* Forces cards to center perfectly when under the max limit */
            gap: 50px; /* Generous spacing between your two main volumes */
            width: 100%;
            max-width: 1100px;
            padding: 20px 0;
        }

        /* Interactive Book Card Wrapper */
        .book-item {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 240px; /* Fixed ideal width for standalone presentation layout */
        }

        /* Soft Paper Cover Container */
        .cover-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4; 
            background-color: #faf8f5;
            border-radius: 2px 6px 6px 2px;
            box-shadow: 0 8px 20px rgba(44, 37, 30, 0.08), 
                        0 2px 5px rgba(44, 37, 30, 0.04);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Subtle vertical linear shadow on the left edge to simulate a book spine fold */
        .cover-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 12px;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.03) 25%, rgba(0,0,0,0) 100%);
            border-radius: 2px 0 0 2px;
            z-index: 2;
        }

        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        /* Elegant Hover Physics */
        .book-item:hover .cover-wrapper {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 16px 32px rgba(44, 37, 30, 0.15), 
                        0 4px 10px rgba(44, 37, 30, 0.08);
            border-color: rgba(140, 131, 117, 0.3);
        }

        .book-item:hover .cover-wrapper img {
            transform: scale(1.03);
        }

        /* Typography Styling for Book Titles */
        .book-info {
            margin-top: 16px;
            text-align: center;
            width: 100%;
        }

        .book-title {
            font-family: 'Georgia', serif;
            font-size: 1.1rem;
            color: #2c251e;
            margin-bottom: 4px;
            transition: color 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-item:hover .book-title {
            color: #8c8375; 
        }

        .book-meta {
            font-size: 0.8rem;
            color: #8c8375;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Responsive Breakpoints */
        @media (max-width: 600px) {
            .library-grid {
                gap: 30px;
            }
            .book-item {
                width: 180px; /* Slightly compact layout rules for mobile browsing */
            }
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Benji's Digital Library</h1>
        <p>Click to read the full comics!</p>
    </header>

    <main class="library-grid">

        <!-- Book 1 Card Entry -->
        <a href="./super-benji-2/index.html" class="book-item">
            <div class="cover-wrapper">
                <!-- Points to front cover image of your first booklet -->
                <img src="./super-benji-2/pages/01.png" alt="Super Benji 2">
            </div>
            <div class="book-info">
                <div class="book-title">Super Benji 2</div>
                <div class="book-meta">58 Pages</div>
            </div>
        </a>

        <!-- Book 2 Card Entry -->
        <a href="./island-jurney-1/index.html" class="book-item">
            <div class="cover-wrapper">
                <!-- Points to front cover image of your second booklet -->
                <img src="./island-jurney-1/pages/01.png" alt="Island Journey 1">
            </div>
            <div class="book-info">
                <div class="book-title">Island Journey 1</div>
                <div class="book-meta">66 Pages</div>
            </div>
        </a>

    </main>

</body>
</html>
