<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benji's digital library!</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/library.css">

    <link rel="apple-touch-icon" sizes="180x180" href="./images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon/favicon-16x16.png">
    <link rel="manifest" href="./images/favicon/site.webmanifest">    

    <!-- Open Graph Metadata (Facebook, Scrapers) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://alonintheworld.com/benji-comics/">
    <meta property="og:title" content="Benjis Digital Library - Interactive Booklet Collection">
    <meta property="og:description" content="Read Benji's comics online! Explore the collection of interactive digital books!">
    <meta property="og:image" content="https://alonintheworld.com/benji-comics/images/front.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Discord & Twitter Cards Meta Tags -->
    <meta name="twitter:card" content="Benji's digital library!">
    <meta name="twitter:title" content="Benjis Digital Library - Interactive Booklet Collection">
    <meta name="twitter:description" content="Read Benji's comics online! Explore the collection of interactive digital books!">
    <meta name="twitter:image" content="https://alonintheworld.com/benji-comics/images/front.png">    
</head>
<body>

    <header>
        <h1>Benji's Digital Library</h1>
        <p>Click to read the full comics!</p>
    </header>

    <main class="library-grid">

        <!-- Book 1 Card Entry -->
        <a href="./super-benji-2/index.html" class="book-item">
            <div class="cover-wrapper">
                <!-- Points to front cover image of your first booklet -->
                <img src="./super-benji-2/pages/01.png" alt="Super Benji 2">
            </div>
            <div class="book-info">
                <div class="book-title">Super Benji 2</div>
                <div class="book-meta">58 Pages</div>
            </div>
        </a>

        <!-- Book 2 Card Entry -->
        <a href="./island-jurney-1/index.html" class="book-item">
            <div class="cover-wrapper">
                <!-- Points to front cover image of your second booklet -->
                <img src="./island-jurney-1/pages/01.png" alt="Island Journey 1">
            </div>
            <div class="book-info">
                <div class="book-title">Island Journey 1</div>
                <div class="book-meta">66 Pages</div>
            </div>
        </a>

    </main>

    <!-- Fixed Copyright Footer -->
    <div id="floating-copyright">
        &copy; <script>document.write(new Date().getFullYear());</script> Boyan Rotem. All rights reserved.
    </div>

</body>
</html>
